<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AbilityListPopup 목업</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #1a1a2e;
  font-family: 'Malgun Gothic', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px;
  gap: 12px;
  min-height: 100vh;
}
h1 { color: #aaa; font-size: 13px; letter-spacing: 1px; }
.hint { color: #666; font-size: 12px; }

/* ── 팝업 프레임 (1080×1920 → 390×780 비율) ── */
.popup {
  width: 390px;
  height: 780px;
  background: #0e0f1c;
  border: 2px solid #2a2a44;
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 12px 60px rgba(0,0,0,0.8);
}

/* ── 헤더 ── */
.header {
  height: 54px; min-height: 54px;
  background: #13142a;
  display: flex; align-items: center;
  padding: 0 14px; gap: 8px;
  border-bottom: 1px solid #2a2a50;
}
.header-title  { flex: 1; color: #eee; font-size: 15px; font-weight: bold; }
.header-count  { color: #668; font-size: 12px; }
.close-btn {
  width: 34px; height: 34px;
  background: #5a1e1e; border: none; border-radius: 5px;
  color: #fff; font-size: 14px; cursor: pointer; font-family: inherit;
}
.close-btn:hover { background: #7a2e2e; }

/* ── 바디 (좌우 분할) ── */
.body {
  flex: 1; display: flex; overflow: hidden;
}

/* ════════════ 좌 패널 (상세 + 총스탯) ════════════ */
.left {
  width: 160px; min-width: 160px;
  display: flex; flex-direction: column;
  border-right: 1px solid #1e1e38;
  overflow: hidden;
}

/* 선택 어빌리티 상세 */
.detail-box {
  padding: 12px 10px 10px;
  background: #12142a;
  border-bottom: 1px solid #1e1e38;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.detail-icon {
  width: 64px; height: 64px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
  border: 2px solid #333;
  background: #1a1c30;
}
.detail-top-row { display: flex; align-items: center; gap: 6px; }
.grade-badge {
  padding: 1px 8px; border-radius: 8px;
  font-size: 10px; font-weight: bold;
}
.b-norm { background:#2a2a3c; color:#9090b0; }
.b-adv  { background:#142040; color:#5aafff; }
.b-spec { background:#302000; color:#ffcc30; }
.detail-name   { color: #fff; font-size: 13px; font-weight: bold; text-align: center; }
.detail-target { color: #667a99; font-size: 11px; }
.detail-divider { width: 100%; height: 1px; background: #1e1e38; margin: 4px 0; }

/* 스탯 행 (선택 어빌리티) */
.detail-stats { width: 100%; }
.stat-row {
  display: flex; align-items: center;
  padding: 3px 0; gap: 4px;
}
.stat-label { color: #888; font-size: 10px; flex: 1; min-width: 0; }
.stat-bar-wrap { width: 44px; height: 5px; background: #1a1a30; border-radius: 3px; overflow: hidden; }
.stat-bar { height: 100%; border-radius: 3px; }
.stat-val { color: #6de27c; font-size: 10px; font-weight: bold; width: 30px; text-align: right; }

/* 트리거 박스 */
.trigger-box {
  width: 100%;
  background: #171830; border: 1px solid #2a2a60; border-radius: 5px;
  padding: 6px 8px; margin-top: 2px;
}
.trigger-label { color: #888; font-size: 9px; margin-bottom: 2px; }
.trigger-val   { color: #ffcc30; font-size: 10px; font-weight: bold; }
.trigger-eff   { color: #ccc; font-size: 10px; margin-top: 4px; line-height: 1.4; }

/* 총 스탯 합산 */
.total-box {
  flex: 1; overflow-y: auto;
  padding: 8px 10px;
  background: #0e0f1c;
}
.total-box::-webkit-scrollbar { width: 2px; }
.total-box::-webkit-scrollbar-thumb { background: #333; }
.total-title {
  color: #556; font-size: 10px; font-weight: bold;
  letter-spacing: 1px; margin-bottom: 6px;
  text-transform: uppercase;
}
.total-row {
  display: flex; align-items: center;
  padding: 4px 0; border-bottom: 1px solid #141420; gap: 4px;
}
.total-label { color: #778; font-size: 10px; flex: 1; }
.total-bar-wrap { width: 48px; height: 5px; background: #1a1a30; border-radius: 3px; overflow: hidden; }
.total-bar { height: 100%; border-radius: 3px; }
.total-val { color: #7cde7c; font-size: 11px; font-weight: bold; width: 32px; text-align: right; }

/* ════════════ 우 패널 (보유 목록) ════════════ */
.right {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden;
}
.list-header {
  height: 36px; min-height: 36px;
  background: #0e0f1c;
  display: flex; align-items: center;
  padding: 0 10px;
  border-bottom: 1px solid #181830;
}
.list-header-txt { color: #556; font-size: 11px; font-weight: bold; letter-spacing: 1px; }

.list-area {
  flex: 1; overflow-y: auto;
  padding: 6px 8px;
  display: flex; flex-direction: column; gap: 5px;
}
.list-area::-webkit-scrollbar { width: 3px; }
.list-area::-webkit-scrollbar-thumb { background: #333; }

/* 목록 아이템 */
.list-item {
  background: #12141f; border: 1px solid #1e1e34; border-radius: 8px;
  display: flex; align-items: center; padding: 8px 10px; gap: 8px;
  cursor: pointer; transition: all 0.12s;
}
.list-item:hover { border-color: #2a2a5a; background: #141628; }
.list-item.selected { border-color: #3a5aaa; background: #141630; box-shadow: 0 0 0 1px #3a5aaa; }

.item-icon {
  width: 44px; height: 44px; min-width: 44px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; border: 2px solid transparent;
}
.item-info { flex: 1; min-width: 0; }
.item-name-row {
  display: flex; align-items: center; gap: 5px; margin-bottom: 3px;
}
.item-name { color: #ddd; font-size: 12px; font-weight: bold; }
.count-badge {
  background: #2a3a6a; color: #7aafff;
  font-size: 10px; font-weight: bold;
  padding: 0 5px; border-radius: 8px; border: 1px solid #3a5aaa;
}
.item-target { color: #667; font-size: 10px; }
.item-grade-badge {
  padding: 1px 6px; border-radius: 6px; font-size: 10px; font-weight: bold;
  align-self: center;
}

/* ── 푸터 ── */
.footer {
  height: 58px; min-height: 58px;
  background: #0e0f1c;
  border-top: 1px solid #1e1e30;
  display: flex; align-items: center; justify-content: center;
}
.close-main-btn {
  width: 150px; height: 42px;
  background: #1e4a1e; border: 1px solid #2a7a2a;
  color: #7fff7f; font-size: 14px; font-weight: bold;
  border-radius: 6px; cursor: pointer; font-family: inherit;
}
.close-main-btn:hover { background: #2a6a2a; }
</style>
</head>
<body>

<h1>AbilityListPopup — 디자인 A (보유 어빌리티)</h1>
<p class="hint">우측 목록에서 어빌리티를 선택하면 좌측 상세가 갱신됩니다</p>

<div class="popup">
  <!-- 헤더 -->
  <div class="header">
    <span class="header-title">보유 어빌리티</span>
    <span class="header-count" id="hdr-count">10개 보유</span>
    <button class="close-btn">✕</button>
  </div>

  <div class="body">
    <!-- 좌: 상세 + 총 스탯 -->
    <div class="left">
      <div class="detail-box" id="detail-box">
        <div class="detail-icon" id="d-icon">⚔️</div>
        <div class="detail-top-row">
          <span class="grade-badge b-norm" id="d-badge">일반</span>
        </div>
        <div class="detail-name"   id="d-name">어빌리티</div>
        <div class="detail-target" id="d-target">대상: 전체</div>
        <div class="detail-divider"></div>
        <div class="detail-stats"  id="d-stats"></div>
      </div>

      <div class="total-box">
        <div class="total-title">총 스탯 합산</div>
        <div id="total-stats"></div>
      </div>
    </div>

    <!-- 우: 보유 목록 -->
    <div class="right">
      <div class="list-header">
        <span class="list-header-txt">보유 목록</span>
      </div>
      <div class="list-area" id="list-area"></div>
    </div>
  </div>

  <div class="footer">
    <button class="close-main-btn">닫기</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════
   실제 AbilityEnums.cs 기준 데이터 (float 비율)
══════════════════════════════════════════════════ */
const DB = {
  A01: { name:'강인한 체력',   grade:'norm', target:'전체',   stats:[['최대 체력', 0.08]], icon:'💪' },
  A02: { name:'예리한 검격',   grade:'norm', target:'전체',   stats:[['공격력',    0.08]], icon:'⚔️' },
  A03: { name:'신속한 연격',   grade:'norm', target:'전체',   stats:[['공격속도',  0.08]], icon:'⚡' },
  A04: { name:'민첩한 기동',   grade:'norm', target:'전체',   stats:[['이동속도',  0.08]], icon:'🏃' },
  A05: { name:'단단한 방어',   grade:'norm', target:'전체',   stats:[['방어율',    0.06]], icon:'🛡️' },
  A06: { name:'기사의 용맹',   grade:'norm', target:'기사',   stats:[['공격력',    0.08], ['최대 체력', 0.06]], icon:'🗡️' },
  A07: { name:'명궁의 직관',   grade:'norm', target:'궁수',   stats:[['사거리',    0.10], ['공격속도', 0.06]], icon:'🎯' },
  A08: { name:'마법사의 집중', grade:'norm', target:'마법사', stats:[['공격력',    0.10], ['스킬 쿨감', 0.08]], icon:'🔮' },
  A09: { name:'방패병의 수호', grade:'norm', target:'방패병', stats:[['방어율',    0.12], ['최대 체력', 0.06]], icon:'🔰' },
  A10: { name:'전사의 돌격',   grade:'norm', target:'근거리', stats:[['공격력',    0.08], ['이동속도', 0.06]], icon:'🔥' },
  A11: { name:'원거리 집중',   grade:'norm', target:'원거리', stats:[['사거리',    0.08], ['공격력',   0.06]], icon:'🏹' },
  A12: { name:'장군의 위엄',   grade:'norm', target:'장군',   stats:[['최대 체력', 0.10], ['방어율',   0.06]], icon:'👑' },
  A13: { name:'병사의 투지',   grade:'norm', target:'병사',   stats:[['공격력',    0.10], ['이동속도', 0.06]], icon:'⚔️' },
  A14: { name:'치명의 감각',   grade:'norm', target:'전체',   stats:[['치명타',    0.06]], icon:'🎯' },
  A15: { name:'넓은 시야',     grade:'norm', target:'전체',   stats:[['사거리',    0.08]], icon:'👁️' },
  B01: { name:'철벽 체력',     grade:'adv',  target:'전체',   stats:[['최대 체력', 0.15]], icon:'❤️' },
  B02: { name:'강철 검격',     grade:'adv',  target:'전체',   stats:[['공격력',    0.15]], icon:'⚔️' },
  B03: { name:'폭풍 연격',     grade:'adv',  target:'전체',   stats:[['공격속도',  0.12]], icon:'💨' },
  B04: { name:'질풍 기동',     grade:'adv',  target:'전체',   stats:[['이동속도',  0.12]], icon:'🌀' },
  B05: { name:'기사의 분노',   grade:'adv',  target:'기사',   stats:[['공격력',    0.15], ['최대 체력', 0.10]], icon:'🗡️' },
  B06: { name:'독수리의 눈',   grade:'adv',  target:'궁수',   stats:[['사거리',    0.15], ['공격속도', 0.12]], icon:'🦅' },
  B07: { name:'마법의 각성',   grade:'adv',  target:'마법사', stats:[['공격력',    0.18], ['스킬 쿨감', 0.15]], icon:'✨' },
  B08: { name:'철옹성',        grade:'adv',  target:'방패병', stats:[['방어율',    0.20], ['최대 체력', 0.12]], icon:'🏰' },
  B09: { name:'광전사의 기세', grade:'adv',  target:'근거리', stats:[['공격력',    0.15], ['이동속도', 0.10]], icon:'💢' },
  B10: { name:'정밀 사격',     grade:'adv',  target:'원거리', stats:[['사거리',    0.12], ['공격력',   0.12]], icon:'🎯' },
  B11: { name:'영웅의 기상',   grade:'adv',  target:'장군',   stats:[['최대 체력', 0.18], ['방어율',   0.12]], icon:'🌟' },
  B12: { name:'병사의 맹세',   grade:'adv',  target:'병사',   stats:[['공격력',    0.18], ['이동속도', 0.12]], icon:'⚔️' },
  C01: { name:'흡혈 강습',     grade:'spec', target:'전체',   trigger:'공격 시', effect:'가한 피해의 15% 즉시 체력 회복', icon:'🩸' },
  C02: { name:'철갑 반응',     grade:'spec', target:'전체',   trigger:'피격 시', effect:'방어율 +15%  (5초 버프)', icon:'🛡️' },
  C03: { name:'처치 연쇄',     grade:'spec', target:'전체',   trigger:'처치 시', effect:'공격력 +20%  (5초 버프)', icon:'💀' },
  C04: { name:'희생의 힘',     grade:'spec', target:'전체',   trigger:'병사 사망 시', effect:'공격력 +20, 체력 +50  (1회, 병사 수만큼)', icon:'💥' },
};

const GRADE_STYLE = {
  norm: { badgeClass:'b-norm', border:'#444',   bg:'#1a1c28', label:'일반' },
  adv:  { badgeClass:'b-adv',  border:'#2a5aaa', bg:'#101828', label:'고급' },
  spec: { badgeClass:'b-spec', border:'#aa8820', bg:'#201800', label:'특수' },
};
const BAR_COLORS = ['#4a9eff','#ff7a7a','#50e37a','#ffc832','#cc77ff','#50dde3'];

/* ══════════════════════════════════════════════════
   "보유 중인" 어빌리티 시뮬레이션 (RunAbilityData)
   — 같은 ID 중복 보유 가능 (Normal/Advanced)
   — Special은 1개 제한
══════════════════════════════════════════════════ */
const HELD = [
  'A01','A01','A01',  // 강인한 체력 ×3
  'A02','A02',        // 예리한 검격 ×2
  'B02',              // 강철 검격 ×1
  'A06',              // 기사의 용맹 ×1
  'A14','A14',        // 치명의 감각 ×2
  'C01',              // 흡혈 강습 ×1 (Special)
];

/* ID별 카운트 계산 */
const countMap = {};
HELD.forEach(id => countMap[id] = (countMap[id] || 0) + 1);

/* 총 스탯 합산 */
function calcTotalStats() {
  const totals = {};
  HELD.forEach(id => {
    const ab = DB[id];
    if (!ab || ab.trigger) return; // Special 스킵
    ab.stats.forEach(([label, val]) => {
      totals[label] = (totals[label] || 0) + val;
    });
  });
  return totals;
}

/* ══════════════════════════════════════════════════
   렌더링
══════════════════════════════════════════════════ */
let selectedId = null;

function buildList() {
  const area = document.getElementById('list-area');
  area.innerHTML = '';

  Object.entries(countMap).forEach(([id, cnt]) => {
    const ab = DB[id];
    if (!ab) return;
    const gs = GRADE_STYLE[ab.grade];

    const item = document.createElement('div');
    item.className = 'list-item' + (id === selectedId ? ' selected' : '');
    item.id = 'item-' + id;

    item.innerHTML = `
      <div class="item-icon" style="background:${gs.bg};border-color:${gs.border}">${ab.icon}</div>
      <div class="item-info">
        <div class="item-name-row">
          <span class="item-name">${ab.name}</span>
          ${cnt > 1 ? `<span class="count-badge">×${cnt}</span>` : ''}
        </div>
        <div class="item-target">${ab.target}</div>
      </div>
      <span class="item-grade-badge ${gs.badgeClass}">${gs.label}</span>
    `;
    item.onclick = () => selectAbility(id);
    area.appendChild(item);
  });

  document.getElementById('hdr-count').textContent =
    `${HELD.length}개 보유`;
}

function selectAbility(id) {
  selectedId = id;
  buildList(); // 선택 하이라이트 갱신

  const ab = DB[id];
  const gs = GRADE_STYLE[ab.grade];
  const cnt = countMap[id];

  // 아이콘 + 등급
  const iconEl = document.getElementById('d-icon');
  iconEl.textContent = ab.icon;
  iconEl.style.borderColor = gs.border;
  iconEl.style.background  = gs.bg;

  const badge = document.getElementById('d-badge');
  badge.textContent = gs.label + (cnt > 1 ? ` ×${cnt}` : '');
  badge.className = 'grade-badge ' + gs.badgeClass;

  document.getElementById('d-name').textContent   = ab.name;
  document.getElementById('d-target').textContent = '대상: ' + ab.target;

  // 스탯 영역
  const statsEl = document.getElementById('d-stats');
  if (ab.trigger) {
    statsEl.innerHTML = `
      <div class="trigger-box">
        <div class="trigger-label">발동 조건</div>
        <div class="trigger-val">${ab.trigger}</div>
        <div class="trigger-eff">${ab.effect}</div>
      </div>`;
  } else {
    statsEl.innerHTML = ab.stats.map(([label, val], i) => {
      const pct = Math.round(val * 100);
      const barW = Math.min(pct * 4, 100); // 최대 100% 바
      return `
        <div class="stat-row">
          <span class="stat-label">${label}</span>
          <div class="stat-bar-wrap">
            <div class="stat-bar" style="width:${barW}%;background:${BAR_COLORS[i]}"></div>
          </div>
          <span class="stat-val">+${pct}%</span>
        </div>`;
    }).join('');
  }
}

function buildTotalStats() {
  const totals = calcTotalStats();
  const el = document.getElementById('total-stats');

  if (Object.keys(totals).length === 0) {
    el.innerHTML = '<div style="color:#556;font-size:11px">보유 스탯 없음</div>';
    return;
  }

  // 값 내림차순 정렬
  const sorted = Object.entries(totals).sort((a,b) => b[1] - a[1]);
  el.innerHTML = sorted.map(([label, val], i) => {
    const pct = Math.round(val * 100);
    const barW = Math.min(pct * 2.5, 100);
    return `
      <div class="total-row">
        <span class="total-label">${label}</span>
        <div class="total-bar-wrap">
          <div class="total-bar" style="width:${barW}%;background:${BAR_COLORS[i % BAR_COLORS.length]}"></div>
        </div>
        <span class="total-val">+${pct}%</span>
      </div>`;
  }).join('');
}

/* 초기화 */
const firstId = Object.keys(countMap)[0];
selectedId = firstId;
buildList();
selectAbility(firstId);
buildTotalStats();
</script>
</body>
</html>
